<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Jeju Fishing Map</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="서비스 소개">
        <p class="kicker">Jeju Coast Archive</p>
        <h1>Jeju Fishing Map</h1>
        <p class="intro">
          제주의 바다, 나만의 낚시 포인트를 찾아보세요.
        </p>
      </header>

      <main class="main-content">
        <section class="coast-hero" aria-labelledby="main-heading">
          <div class="coast-scene" aria-hidden="true">
            <img
              src="./assets/jeju-coast.jpg"
              alt=""
              width="1536"
              height="1024"
              fetchpriority="high"
            />
          </div>

          <div class="hero-copy">
            <p class="section-label">Jeju Island</p>
            <h2 id="main-heading">바다와 가까워지는 시간</h2>
            <p>
              푸른 해안선과 잔잔한 파도.<br />
              제주에서의 낚시는 바다를 천천히 바라보는 일에서 시작됩니다.
            </p>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>© <span data-current-year></span> Jeju Fishing Map</span>
      </footer>
    </div>
  </body>
</html>
