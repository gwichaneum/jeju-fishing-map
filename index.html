<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Jeju Fishing Map</title>
    <link rel="preload" as="image" href="./assets/jeju-coast.jpg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./fishing-spots.js"></script>
    <script defer src="./script.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <main class="main-content">
        <section class="hero-map" aria-labelledby="main-heading">
          <header class="hero-copy">
            <p class="kicker">JEJU COAST ARCHIVE</p>
            <h1 id="main-heading">Jeju Fishing Map</h1>
            <p class="intro" id="map-description">
              제주의 바다,<br />
              나만의 낚시 포인트를 찾아보세요.
            </p>
          </header>

          <div class="map-frame">
            <div
              id="jeju-map"
              class="jeju-map"
              role="region"
              aria-label="제주도 지도"
              aria-describedby="map-description"
            ></div>
            <p class="map-status" role="status">지도를 불러오는 중입니다.</p>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>© <span data-current-year></span> Jeju Fishing Map</span>
      </footer>
    </div>
  </body>
</html>
